[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clipcut"
version = "2.5.0"
description = "ClipCut: Autonomous AI Video Clipping & Shorts Studio"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "CM Studio", email = "support@clipcut.ai"},
]
keywords = ["video", "clipping", "shorts", "reels", "tiktok", "whisper", "ai", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "psycopg>=3.1.0",
    "psycopg-binary>=3.1.0",
    "python-multipart>=0.0.9",
    "sherpa-onnx>=1.10.0",
    "soundfile>=0.12.0",
    "SQLAlchemy>=2.0.0",
    "uvicorn>=0.30.0",
    "yt-dlp>=2024.1.1",
    "pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/CM-Studio77/Clipcut"
Repository = "https://github.com/CM-Studio77/Clipcut.git"
Issues = "https://github.com/CM-Studio77/Clipcut/issues"

[project.scripts]
clipcut = "studio.server:main"
clipcut-admin = "studio.admin:main"
