      <rect x="88" y="6" width="4" height="28" rx="2" fill="#00f3ff"/>
      <rect x="96" y="10" width="4" height="20" rx="2" fill="#00f3ff"/>
      <rect x="104" y="4" width="4" height="32" rx="2" fill="#00ff9d"/>
      <rect x="112" y="0" width="4" height="40" rx="2" fill="#00ff9d"/>
      <rect x="120" y="8" width="4" height="24" rx="2" fill="#00f3ff"/>
      <rect x="128" y="14" width="4" height="12" rx="2" fill="#00f3ff"/>
      <rect x="136" y="4" width="4" height="32" rx="2" fill="#00f3ff"/>
      <rect x="144" y="0" width="4" height="40" rx="2" fill="#00f3ff"/>
      <rect x="152" y="6" width="4" height="28" rx="2" fill="#00f3ff"/>
      <rect x="160" y="12" width="4" height="16" rx="2" fill="#00f3ff"/>
      <rect x="168" y="4" width="4" height="32" rx="2" fill="#00f3ff"/>
      <rect x="176" y="0" width="4" height="40" rx="2" fill="#00ff9d"/>
