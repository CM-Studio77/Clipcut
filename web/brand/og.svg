    <rect x="52" y="375" width="236" height="52" rx="14" fill="rgba(10, 11, 16, 0.88)" stroke="rgba(255, 255, 255, 0.12)"/>
    <text x="70" y="407" font-family="'Archivo Black', 'Poppins', sans-serif" font-size="17" font-weight="900" fill="#FFFFFF">
